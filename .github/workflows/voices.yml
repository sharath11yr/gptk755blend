name: Voice samples
on: workflow_dispatch
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: pip install -q edge-tts "kokoro>=0.9.4" soundfile
      - run: python studio/voices/samples.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: voice-samples/*.mp3
          retention-days: 14
