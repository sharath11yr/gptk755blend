name: Explainer video

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode file in studio/explainer/episodes/"
        default: "filter.json"

permissions:
  contents: write   # stills go to the 'previews' branch for checking

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: {run: {working-directory: studio/explainer}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          npm ci || npm install
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          pip install edge-tts "kokoro>=0.9.4" soundfile
          command -v ffmpeg || (pip install imageio-ffmpeg && sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg)
          command -v ffprobe || sudo apt-get install -y ffmpeg
      - name: Real photos (Wikimedia Commons, licensed)
        run: pip install -q httpx && python fetch_images.py "episodes/${{ inputs.episode }}"
      - name: Voice, timing and music
        run: python voice.py "episodes/${{ inputs.episode }}" public props.json
      - name: Render the explainer (1920x1080) and the Short (1080x1920)
        run: |
          npx remotion render src/index.ts Explainer out/video.mp4 --props=props.json --concurrency=4 --crf=18
          npx remotion render src/index.ts Short out/short.mp4 --props=props_short.json --concurrency=4 --crf=18
      - name: Add the music bed under the voice
        run: |
          for v in video short; do
            B=public/music.wav; [ $v = short ] && [ -f public/music_short.wav ] && B=public/music_short.wav
            ffmpeg -y -loglevel error -i out/$v.mp4 -i $B -filter_complex "[1:a]volume=0.45[m];[0:a][m]amix=inputs=2:duration=first:normalize=0[a]" \
              -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k out/${v}_final.mp4
          done
      - name: Add the channel intro and outro (16:9 lesson only)
        run: |
          if [ -f brand/intro.mp4 ] && [ -f brand/outro.mp4 ]; then
            N="scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p"
            ffmpeg -y -loglevel error -i brand/intro.mp4 -i out/video_final.mp4 -i brand/outro.mp4 -filter_complex \
              "[0:v]$N[v0];[1:v]$N[v1];[2:v]$N[v2];[0:a]aresample=48000,aformat=channel_layouts=stereo[a0];[1:a]aresample=48000,aformat=channel_layouts=stereo[a1];[2:a]aresample=48000,aformat=channel_layouts=stereo[a2];[v0][a0][v1][a1][v2][a2]concat=n=3:v=1:a=1[v][a]" \
              -map "[v]" -map "[a]" -c:v libx264 -crf 19 -preset medium -c:a aac -b:a 192k -movflags +faststart out/video_branded.mp4
            mv out/video_branded.mp4 out/video_final.mp4
          fi
      - name: Stills for checking
        run: |
          mkdir -p out/stills
          for t in 5 20 40 60 80 100 120 140 160 180 200 220; do ffmpeg -y -loglevel error -ss $t -i out/video_final.mp4 -frames:v 1 -vf scale=960:-1 out/stills/v_$t.jpg || true; done
          for t in 2 10 20 30 40; do ffmpeg -y -loglevel error -ss $t -i out/short_final.mp4 -frames:v 1 -vf scale=540:-1 out/stills/s_$t.jpg || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: explainer-video
          retention-days: 14
          path: |
            studio/explainer/out/*_final.mp4
            studio/explainer/out/stills/*
            studio/explainer/out/credits.txt
